name: Build and Release Android APK

on:
  push:
    branches: [ main, feature-face-recognition-opt ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove any local properties
        run: rm -f android_app/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          build-root-directory: ./android_app
          arguments: assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OculusAI-Android-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}-face-opt
          name: Oculus AI Mobile App v1.0.${{ github.run_number }} (Face Recognition & High FPS)
          body: |
            ## Oculus AI Mobile Android App - Face Identification & High FPS Update
            - **Face Identification (Named Contacts)**: ML Kit Face Detection + MobileFaceNet on-device facial embeddings.
            - **High Frame Rate ($25\text{–}30+\text{ FPS}$)**: Non-blocking parallel AI vision pipeline with zero-allocation camera frames.
            - Download `app-debug.apk` below for 1-click installation on Android.
          files: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
