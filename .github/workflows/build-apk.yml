name: Build and Release Android APK

on:
  push:
    branches: [ main, dev-perf-optimization ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove any local properties
        run: rm -f android_app/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          build-root-directory: ./android_app
          arguments: assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OculusAI-Android-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}-perf-opt
          name: Oculus AI Mobile App v1.0.${{ github.run_number }} (Pixel 6a Perf Optimization)
          body: |
            ## Oculus AI Mobile Android App - High-Performance Update (Pixel 6a)
            - **Target Hardware Optimization**: Google Pixel 6a (Google Tensor G1) with zero-allocation direct ByteBuffer preprocessing.
            - **Throughput Boost**: High-speed YOLO26n 320x320 pipeline running sustained 20-30+ FPS.
            - **Intelligent Face Scheduling**: Throttled 4.5 FPS face recognition with track-state gating and zero in-flight pileup.
            - **P95 Latency Telemetry**: Real-time HUD tracking source FPS, AI FPS, P95 latency, and inference benchmarks.
            - Download `app-debug.apk` below for 1-click installation on Android.
          files: |
            android_app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
